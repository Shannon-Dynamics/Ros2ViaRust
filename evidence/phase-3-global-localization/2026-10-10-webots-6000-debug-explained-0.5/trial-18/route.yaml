# Exploration route for a global localization trial, written by
# crates/robotics_localization/examples/global_trials.rs (subcommand `route`).
# Start pose: x=0.0000 y=0.0000 yaw=0.0000. A square of side 1.2 m with one
# corner at the start, closed back at the start.
route:
  name: global-localization-exploration

waypoints:
  - {x: 1.2000, y: 0.0000}
  - {x: 1.2000, y: 1.2000}
  - {x: 0.0000, y: 1.2000}
  - {x: 0.0000, y: 0.0000}
