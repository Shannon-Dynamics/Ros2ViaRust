# Phase 4 evaluation route 2 of 3: four lobes out to the walls, each ending in a run along the wall.
#
# Used by claim M1 of ../../../docs/phase-4-mapping/problem.md section 4 (see the header of
# ./route_eval_cross.yaml for why three routes and why none may be a variant of
# ./route_long.yaml). Written after the parameters were frozen and before any evaluation run.
#
# What the route is: a counter-clockwise tour of the four walls. From the spawn pose it goes out
# towards the east wall, runs 1.2 m along it, comes back in past landmark_a to the north wall,
# runs 1.4 m along that, comes in, goes out to the west wall and runs 1.2 m along it, comes in
# again and goes to the south wall, where it ends after a run of 0.6 m along it. Twelve
# waypoints, twelve turns in place, 18.09 m.
#
# Why this shape, and what it stresses:
#
#   * Each wall is met twice in different ways: approached within 35 degrees of its normal
#     (the last 0.45 m of the leg that reaches it), and then seen side-on for the run along it
#     with the wall 90 degrees to the robot's heading. ./route_eval_cross.yaml only meets walls
#     head-on and ./route_long.yaml never came within 1.2 m of one.
#   * The pillars sit near the diagonals of the room (2.2 to 2.4 m from the middle), so a loop at
#     wall level does not exist; the route threads the gaps between them and uses the middle of
#     the room as the way between lobes.
#   * Turn geometry is moderate and mixed, from 22 to 103 degrees (against 68 to 166 degrees,
#     almost all of them sharp, for ./route_long.yaml), twelve of them. The tour is counter-
#     clockwise, so on every run along a wall the wall is on the robot's right.
#   * Not shaped to avoid any wall segment or heading where the development run's false occupied
#     cells fell, and not shaped to hit them.
#
# Driver rate: the default 0.8 rad/s, so this route differs from ./route_long.yaml by geometry.
#
# Clearance, `centre-to-leg distance - 0.15 - 0.11`, over every leg:
#   landmark_a (1.8, 1.2)   tightest leg (2.55, 0.3) -> (1.0, 0.7): centre 0.68 m, gap 0.42 m
#   landmark_b (-1.4, 2.0)  tightest leg (-0.7, 2.55) -> (-0.7, 1.0): centre 0.70 m, gap 0.44 m
#   landmark_c (-2.0, -1.0) tightest leg (-2.55, -0.3) -> (-1.2, 0.0): centre 0.80 m, gap 0.54 m
#   landmark_d (0.9, -2.1)  tightest leg (-0.4, -2.55) -> (0.2, -2.55): centre 0.83 m, gap 0.57 m
# For comparison the tightest leg of ./route_long.yaml has a gap of 0.39 m to landmark_a and the
# runs along it completed. Walls: the wall runs are 0.45 m from the face, 0.34 m clear of the
# footprint.
#
# No waypoint is shared with ./route_long.yaml or with ./route_eval_cross.yaml. The route does not
# return to the spawn pose: a mapping run has no use for it.
# Coordinates are the map frame of ./landmarks.yaml, metres.

route:
  name: wall-lobes

waypoints:
  # East lobe: out, then north along the east wall.
  - {x: 1.200, y: -0.700}
  - {x: 2.550, y: -0.900}
  - {x: 2.550, y: 0.300}
  # In past landmark_a, out to the north wall, west along it.
  - {x: 1.000, y: 0.700}
  - {x: 0.700, y: 2.550}
  - {x: -0.700, y: 2.550}
  # In, out to the west wall, south along it.
  - {x: -0.700, y: 1.000}
  - {x: -2.550, y: 0.900}
  - {x: -2.550, y: -0.300}
  # In, out to the south wall, east along it, and stop there.
  - {x: -1.200, y: 0.000}
  - {x: -0.400, y: -2.550}
  - {x: 0.200, y: -2.550}
