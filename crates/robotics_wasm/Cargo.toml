[package]
name = "robotics_wasm"
description = "WebAssembly build target of the pure-algorithm crates (robotics_core, robotics_models, robotics_filters, robotics_sim, robotics_mapping, robotics_localization) for the ROS via Rust webbook: thin wasm-bindgen wrappers, no algorithms of its own"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Shannon Robotics"]
publish = false

# A workspace of its own, deliberately. The robotics workspace at the repository root builds
# ROS 2 packages and has a Cargo.lock that colcon and the Phase 3 gates depend on; adding
# wasm-bindgen to it would change that lock for a target the robot never runs. This crate
# only *depends on* the pure crates by path, so it compiles exactly the code the robot runs.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
robotics_core = { path = "../robotics_core" }
robotics_models = { path = "../robotics_models" }
robotics_filters = { path = "../robotics_filters" }
robotics_sim = { path = "../robotics_sim" }
robotics_mapping = { path = "../robotics_mapping" }
robotics_localization = { path = "../robotics_localization" }
robotics_slam = { path = "../robotics_slam" }
nalgebra = "0.35"
rand = "0.10"
rand_distr = "0.6"
# Pinned with `=`: the wasm-bindgen CLI that post-processes the module must be the same
# version, or the glue and the module disagree (`scripts/build-wasm.mjs` checks this).
wasm-bindgen = "=0.2.129"

# rand 0.10's default features pull `getrandom`, which refuses to compile for
# wasm32-unknown-unknown unless a backend is chosen. This is the one blocker the pure crates
# had; it is resolved here, without touching their manifests, by selecting the browser
# backend. Nothing in the pure crates draws OS entropy (every generator is `seeded_rng`),
# and `web/checks` asserts that, so the backend is linked but never reached.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The documented-table test replays ten 180 s drives; unoptimized that takes minutes.
[profile.test]
opt-level = 3
